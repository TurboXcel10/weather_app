```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            padding: 20px;
        }

        .weather-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            padding: 30px;
            color: white;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .title {
            font-size: 30px;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .search-box input {
            flex: 1;
            padding: 14px 16px;
            border: none;
            outline: none;
            border-radius: 12px;
            font-size: 16px;
        }

        .search-box button {
            padding: 14px 18px;
            border: none;
            border-radius: 12px;
            background: #ffffff;
            color: #1683e8;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-box button:hover {
            transform: translateY(-2px);
            background: #f0f0f0;
        }

        .weather-icon {
            font-size: 75px;
            margin-bottom: 10px;
        }

        .city {
            font-size: 28px;
            font-weight: bold;
        }

        .date {
            margin-top: 5px;
            opacity: 0.85;
        }

        .temperature {
            font-size: 65px;
            font-weight: bold;
            margin: 20px 0 5px;
        }

        .condition {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .detail-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 18px 10px;
            border-radius: 15px;
        }

        .detail-icon {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .detail-title {
            font-size: 13px;
            opacity: 0.8;
        }

        .detail-value {
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
        }

        .message {
            margin-top: 20px;
            font-size: 14px;
            color: #fff;
        }

        .loading {
            display: none;
            margin-top: 15px;
        }

        @media (max-width: 450px) {
            .weather-container {
                padding: 22px;
            }

            .title {
                font-size: 26px;
            }

            .temperature {
                font-size: 55px;
            }

            .search-box input {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="weather-container">

        <h1 class="title">🌤️ Weather App</h1>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >

            <button onclick="searchWeather()">
                Search
            </button>
        </div>

        <div class="loading" id="loading">
            Loading weather...
        </div>

        <div id="weather">

            <div class="weather-icon" id="weatherIcon">
                🌤️
            </div>

            <h2 class="city" id="city">
                Search a city
            </h2>

            <p class="date" id="date">
                Get the latest weather information
            </p>

            <div class="temperature" id="temperature">
                --°C
            </div>

            <div class="condition" id="condition">
                --
            </div>

            <div class="weather-details">

                <div class="detail-card">
                    <div class="detail-icon">💧</div>
                    <div class="detail-title">
                        Humidity
                    </div>
                    <div class="detail-value" id="humidity">
                        --%
                    </div>
                </div>

                <div class="detail-card">
                    <div class="detail-icon">💨</div>
                    <div class="detail-title">
                        Wind Speed
                    </div>
                    <div class="detail-value" id="wind">
                        -- km/h
                    </div>
                </div>

                <div class="detail-card">
                    <div class="detail-icon">🌡️</div>
                    <div class="detail-title">
                        Feels Like
                    </div>
                    <div class="detail-value" id="feelsLike">
                        --°C
                    </div>
                </div>

                <div class="detail-card">
                    <div class="detail-icon">🌧️</div>
                    <div class="detail-title">
                        Precipitation
                    </div>
                    <div class="detail-value" id="rain">
                        -- mm
                    </div>
                </div>

            </div>

            <p class="message" id="message"></p>

        </div>
    </div>


    <script>

        // Convert Open-Meteo weather code
        function getWeatherInfo(code) {

            const weatherCodes = {

                0: {
                    condition: "Clear Sky",
                    icon: "☀️"
                },

                1: {
                    condition: "Mainly Clear",
                    icon: "🌤️"
                },

                2: {
                    condition: "Partly Cloudy",
                    icon: "⛅"
                },

                3: {
                    condition: "Overcast",
                    icon: "☁️"
                },

                45: {
                    condition: "Fog",
                    icon: "🌫️"
                },

                48: {
                    condition: "Fog",
                    icon: "🌫️"
                },

                51: {
                    condition: "Light Drizzle",
                    icon: "🌦️"
                },

                53: {
                    condition: "Drizzle",
                    icon: "🌦️"
                },

                55: {
                    condition: "Heavy Drizzle",
                    icon: "🌧️"
                },

                61: {
                    condition: "Light Rain",
                    icon: "🌦️"
                },

                63: {
                    condition: "Rain",
                    icon: "🌧️"
                },

                65: {
                    condition: "Heavy Rain",
                    icon: "🌧️"
                },

                71: {
                    condition: "Light Snow",
                    icon: "🌨️"
                },

                73: {
                    condition: "Snow",
                    icon: "❄️"
                },

                75: {
                    condition: "Heavy Snow",
                    icon: "❄️"
                },

                80: {
                    condition: "Rain Showers",
                    icon: "🌦️"
                },

                81: {
                    condition: "Rain Showers",
                    icon: "🌧️"
                },

                82: {
                    condition: "Heavy Rain Showers",
                    icon: "⛈️"
                },

                95: {
                    condition: "Thunderstorm",
                    icon: "⛈️"
                },

                96: {
                    condition: "Thunderstorm with Hail",
                    icon: "⛈️"
                },

                99: {
                    condition: "Heavy Thunderstorm",
                    icon: "⛈️"
                }
            };

            return weatherCodes[code] || {
                condition: "Unknown",
                icon: "🌤️"
            };
        }


        // Search weather
        async function searchWeather() {

            const cityInput =
                document.getElementById("cityInput");

            const cityName =
                cityInput.value.trim();

            const loading =
                document.getElementById("loading");

            const message =
                document.getElementById("message");


            if (!cityName) {

                message.textContent =
                    "Please enter a city name.";

                return;
            }


            try {

                loading.style.display = "block";

                message.textContent = "";


                // Get latitude and longitude
                const geoResponse =
                    await fetch(
                        `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=en&format=json`
                    );


                const geoData =
                    await geoResponse.json();


                if (!geoData.results ||
                    geoData.results.length === 0) {

                    throw new Error(
                        "City not found"
                    );
                }


                const location =
                    geoData.results[0];


                const latitude =
                    location.latitude;

                const longitude =
                    location.longitude;


                // Get weather
                const weatherResponse =
                    await fetch(
                        `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_rain,precipitation,weather_code,wind_speed_10m&timezone=auto`
                    );


                const weatherData =
                    await weatherResponse.json();


                const current =
                    weatherData.current;


                const weatherInfo =
                    getWeatherInfo(
                        current.weather_code
                    );


                // Update UI
                document.getElementById("city")
                    .textContent =
                    `${location.name}, ${location.country_code}`;


                document.getElementById("date")
                    .textContent =
                    new Date().toLocaleString(
                        "en-IN",
                        {
                            weekday: "long",
                            day: "numeric",
                            month: "long",
                            year: "numeric"
                        }
                    );


                document.getElementById("weatherIcon")
                    .textContent =
                    weatherInfo.icon;


                document.getElementById("temperature")
                    .textContent =
                    `${Math.round(current.temperature_2m)}°C`;


                document.getElementById("condition")
                    .textContent =
                    weatherInfo.condition;


                document.getElementById("humidity")
                    .textContent =
                    `${current.relative_humidity_2m}%`;


                document.getElementById("wind")
                    .textContent =
                    `${Math.round(current.wind_speed_10m)} km/h`;


                document.getElementById("feelsLike")
                    .textContent =
                    `${Math.round(current.apparent_temperature)}°C`;


                document.getElementById("rain")
                    .textContent =
                    `${current.precipitation} mm`;


            } catch (error) {

                message.textContent =
                    "Unable to find weather data. Please check the city name.";

                console.error(error);

            } finally {

                loading.style.display = "none";

            }
        }


        // Press Enter to search
        document.getElementById("cityInput")
            .addEventListener(
                "keypress",
                function(event) {

                    if (event.key === "Enter") {
                        searchWeather();
                    }

                }
            );

    </script>

</body>
</html>
```
